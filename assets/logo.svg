<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 60" width="170" height="60" role="img" aria-label="שוק ההון">
  <defs>
    <linearGradient id="ng" x1="14" y1="0" x2="152" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="0.42" stop-color="#17b6d8"/>
      <stop offset="0.72" stop-color="#38d84a"/>
      <stop offset="1" stop-color="#93f24a"/>
    </linearGradient>
    <radialGradient id="node" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#f2ffb4"/>
      <stop offset="0.62" stop-color="#8bef3c"/>
      <stop offset="1" stop-color="#8bef3c" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-70%" width="180%" height="240%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
    <path id="ribbon" d="M14,49 L72,26.8 L90,35.8 L126,17.8 L152,7 L126,22.2 L90,40.2 L72,31.2 Z"/>
  </defs>
  <!-- soft glow underlay -->
  <use href="#ribbon" fill="url(#ng)" filter="url(#glow)" opacity="0.55"/>
  <!-- crisp tapered ribbon: sharp points at both ends -->
  <use href="#ribbon" fill="url(#ng)" stroke="url(#ng)" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- sparkle highlights along the line -->
  <circle cx="43" cy="37" r="1.4" fill="#eaf6ff"/>
  <circle cx="82" cy="33.4" r="1.3" fill="#e6fff0"/>
  <circle cx="110" cy="27" r="1.3" fill="#f2ffcf"/>
  <!-- glowing node -->
  <circle cx="126" cy="19" r="13" fill="url(#node)"/>
  <circle cx="126" cy="19" r="3.4" fill="#ffffff"/>
</svg>
