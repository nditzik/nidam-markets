<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>שוק ההון של איציק נידם</title>
  <meta name="description" content="סקירת שוק יומית: מדדים, מומנטום, מועמדים למסחר ותדריכי משקיעים — במקום אחד." />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" />
  <link rel="apple-touch-icon" href="assets/favicon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">דלג לתוכן</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand">
        <img class="brand-logo" src="assets/logo.svg" alt="שוק ההון של איציק נידם" width="168" height="60" />
      </div>
      <div class="brand-text">
        <h1>שוק ההון של איציק נידם</h1>
        <p class="tagline">סקירת שוק יומית · מדדים · מומנטום · מועמדים · תדריכים</p>
      </div>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="החלף מצב תצוגה">🌙</button>
    </div>
  </header>

  <nav class="tabs wrap" role="tablist" aria-label="ניווט ראשי">
    <button class="tab is-active" role="tab" data-tab="home">בית</button>
    <button class="tab" role="tab" data-tab="momentum">מומנטום</button>
    <button class="tab" role="tab" data-tab="indices">מדדים</button>
    <button class="tab" role="tab" data-tab="candidates">מועמדים</button>
    <button class="tab" role="tab" data-tab="morning">סקירת בוקר</button>
    <button class="tab" role="tab" data-tab="briefing">תדרוך משקיעים</button>
    <button class="tab" role="tab" data-tab="reports">דוחות</button>
  </nav>

  <div id="ticker-wrap" class="wrap">
    <div id="ticker" class="ticker-tape" dir="ltr" aria-label="נתוני שוק בזמן אמת"></div>
    <div class="tg-cta">
      <a class="tg-btn" href="https://t.me/nidam_markets" target="_blank" rel="noopener" aria-label="הצטרפו לערוץ הטלגרם">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71l-4.14-3.05-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg>
        <span class="tg-txt">הצטרפו לערוץ הטלגרם — תזכורות בוקר וצהריים</span>
      </a>
    </div>
  </div>

  <main id="main" class="wrap">
    <div id="today-bar" class="today-bar" aria-label="מה חדש היום"></div>

    <!-- Home / market overview -->
    <section class="panel is-active" id="panel-home" role="tabpanel">
      <div class="panel-loading">טוען נתוני שוק…</div>
    </section>

    <section class="panel" id="panel-momentum" role="tabpanel"></section>
    <section class="panel" id="panel-indices" role="tabpanel"></section>
    <section class="panel" id="panel-candidates" role="tabpanel"></section>
    <section class="panel" id="panel-morning" role="tabpanel"></section>
    <section class="panel" id="panel-briefing" role="tabpanel"></section>
    <section class="panel" id="panel-reports" role="tabpanel"></section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div id="health" class="health" aria-label="מצב עדכון המקורות"></div>
      <p class="disclaimer">התוכן באתר אינו מהווה ייעוץ השקעות ואינו תחליף לייעוץ המתחשב בנתוניו של כל אדם.</p>
      <p class="credit">© <span id="year"></span> איציק נידם · שוק ההון</p>
    </div>
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>
