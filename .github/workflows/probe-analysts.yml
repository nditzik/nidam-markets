name: Probe analyst data (one-off)

# בדיקה חד-פעמית (2.10.2026) לפיצ'ר "לקראת הדוח": אנליסטים + נרות + אופציות ל-JPM.
# לא כותב קבצים ולא מקמט. יימחק אחרי הבדיקה.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-analysts.yml"
      - "scripts/tools/probe_analysts.py"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/tools/probe_analysts.py JPM
