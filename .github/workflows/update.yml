name: update-data

# עדכון אוטומטי 3 פעמים ביום. cron ב-GitHub הוא UTC.
# שעון קיץ (ישראל UTC+3):
#   04:30 UTC ≈ 07:30 בוקר   → תופס בריף בוקר (נשלח 06:00)
#   09:30 UTC ≈ 12:30 צהריים → רענון מדדים/מומנטום
#   12:30 UTC ≈ 15:30 אחה"צ  → תופס בריף צהריים (נשלח 15:00)
# ⚠️ שעון חורף (נוב'–מרץ, ישראל UTC+2): להזיז כל שורה +1 שעה כדי לשמור על אותן שעות ישראל.
#    בפרט את ריצת אחה"צ ל-"30 13 * * 1-6" — אחרת תרוץ ב-14:30 ותחמיץ את בריף הצהריים.
on:
  schedule:
    - cron: "30 4 * * 1-6"
    - cron: "30 9 * * 1-6"
    - cron: "30 12 * * 1-6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --- משיכת מדדים מריפו indexes-status ---
      - name: Fetch indices
        run: python scripts/fetch_dashboards.py
        continue-on-error: true   # עמידות: כשל מקור אחד לא מפיל את כל הריצה

      # --- משיכת מומנטום מריפו stocks-momentum ---
      - name: Fetch momentum
        run: python scripts/fetch_momentum.py
        continue-on-error: true

      # --- משיכת תדרוך משקיעים מג'ימייל (דורש GMAIL_USER + GMAIL_APP_PASSWORD ב-Secrets) ---
      - name: Fetch gmail briefings
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/fetch_gmail.py
        continue-on-error: true

      # --- משיכת סקירת בוקר (Barchart Pre-Market Bulletin) מג'ימייל ---
      - name: Fetch Barchart morning review
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/fetch_barchart.py
        continue-on-error: true

      # --- משיכת מועמדי IBKR ממייל [IBKR-CANDIDATES] (נשלח מהמערכת המקומית) ---
      - name: Fetch IBKR candidates
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/fetch_ibkr.py
        continue-on-error: true

      - name: Commit if changed
        run: |
          git config user.name "nidam-markets-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "אין שינוי בנתונים — לא מבצע commit."
          else
            git commit -m "data: עדכון אוטומטי $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
