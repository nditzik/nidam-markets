name: update-data

# עדכון אוטומטי 3 פעמים ביום. cron ב-GitHub הוא UTC.
# שעון קיץ (ישראל UTC+3):
#   04:30 UTC ≈ 07:30 בוקר   → תופס בריף בוקר (נשלח 06:00)
#   09:30 UTC ≈ 12:30 צהריים → רענון מדדים/מומנטום
#   12:30 UTC ≈ 15:30 אחה"צ  → תופס בריף צהריים (נשלח 15:00)
# ⚠️ שעון חורף (נוב'–מרץ, ישראל UTC+2): להזיז כל שורה +1 שעה כדי לשמור על אותן שעות ישראל.
#    בפרט את ריצת אחה"צ ל-"30 13 * * 1-6" — אחרת תרוץ ב-14:30 ותחמיץ את בריף הצהריים.
on:
  schedule:
    - cron: "30 4 * * 1-6"
    - cron: "30 9 * * 1-6"
    - cron: "30 12 * * 1-6"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "שלח הודעת בדיקה לערוץ הטלגרם"
        type: boolean
        default: false
      test_digest:
        description: "שלח תקציר בוקר לניסיון (לערוץ)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --- משיכת מדדים מריפו indexes-status ---
      - name: Fetch indices
        run: python scripts/fetch_dashboards.py
        continue-on-error: true   # עמידות: כשל מקור אחד לא מפיל את כל הריצה

      # --- ארכיון ציונים יומי (מזין את גרף המגמה של המד) ---
      - name: Archive daily scores
        run: python scripts/archive_scores.py
        continue-on-error: true

      # --- משיכת מומנטום מריפו stocks-momentum ---
      - name: Fetch momentum
        run: python scripts/fetch_momentum.py
        continue-on-error: true

      # --- משיכת תדרוך משקיעים מג'ימייל (דורש GMAIL_USER + GMAIL_APP_PASSWORD ב-Secrets) ---
      - name: Fetch gmail briefings
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/fetch_gmail.py
        continue-on-error: true

      # --- משיכת סקירת בוקר (Barchart Pre-Market Bulletin) מג'ימייל ---
      - name: Fetch Barchart morning review
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/fetch_barchart.py
        continue-on-error: true

      # --- משיכת מועמדי IBKR מהריפו הציבורי nidam-candidates (נדחף מהמערכת המקומית) ---
      - name: Fetch IBKR candidates
        run: python scripts/fetch_ibkr.py
        continue-on-error: true

      # --- בדיקת חיבור טלגרם (רק כשמריצים ידנית עם הסימון) ---
      - name: Telegram connection test
        if: ${{ inputs.test_telegram }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_ADMIN_CHAT: ${{ secrets.TELEGRAM_ADMIN_CHAT }}
        run: |
          python scripts/notify_telegram.py --test
          python scripts/notify_earnings_age.py --test
        continue-on-error: true

      # --- תזכורת טלגרם על תדרוך חדש (דורש TELEGRAM_BOT_TOKEN + TELEGRAM_CHANNEL) ---
      - name: Notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: python scripts/notify_telegram.py
        continue-on-error: true

      # --- משיכת ניתוחי דוחות חברות מריפו nidam-reports ---
      - name: Fetch reports
        run: python scripts/fetch_reports.py
        continue-on-error: true

      # --- דוח הרוטציה הסקטוריאלית השבועי (nidam-reports/sectors) ---
      - name: Fetch sector reports
        run: python scripts/fetch_sectors.py
        continue-on-error: true

      # --- מחירי שוק חיים (Yahoo Finance) לסרט בדף הבית ---
      - name: Fetch market quotes
        run: python scripts/fetch_market.py
        continue-on-error: true

      # --- מי מדווחת היום (מתוך earnings.csv שאיציק מעדכן שבועית) ---
      - name: Fetch earnings calendar
        run: python scripts/fetch_earnings.py
        continue-on-error: true

      # --- התראה פרטית לאיציק אם earnings.csv מתיישן (21+ יום) ---
      - name: Earnings staleness alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT: ${{ secrets.TELEGRAM_ADMIN_CHAT }}
        run: python scripts/notify_earnings_age.py
        continue-on-error: true

      # --- כותרות שוק מ-RSS, מתורגמות לעברית (עם מטמון) ---
      - name: Fetch market news
        run: python scripts/fetch_news.py
        continue-on-error: true

      # --- המניות הבולטות של היום (Yahoo screeners) ---
      - name: Fetch top movers
        run: python scripts/fetch_movers.py
        continue-on-error: true

      # --- "המוקד במבחן": ארכוב מניות-במוקד ומדידת ביצוע מול S&P ---
      - name: Archive focus picks
        run: python scripts/archive_focus.py
        continue-on-error: true

      # --- "בזק מהרשת": חשבונות X דרך שיקופי טלגרם + Nitter ---
      - name: Fetch X pulse
        run: python scripts/fetch_pulse.py
        continue-on-error: true

      # --- תקציר בוקר לערוץ (נשלח רק כשמדדים+מומנטום+מועמדים+תדרוך בוקר עודכנו היום) ---
      - name: Morning digest to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: python scripts/notify_digest.py
        continue-on-error: true

      # --- ניסיון ידני של התקציר (עוקף שערים, נשלח מיד לערוץ) ---
      - name: Digest test
        if: ${{ inputs.test_digest }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: python scripts/notify_digest.py --test
        continue-on-error: true

      # --- מחוון בריאות: חותמת טריות לכל מקור (רץ אחרון, לפני commit) ---
      - name: Build health status
        run: python scripts/build_health.py
        continue-on-error: true

      - name: Commit if changed
        run: |
          git config user.name "nidam-markets-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "אין שינוי בנתונים — לא מבצע commit."
          else
            git commit -m "data: עדכון אוטומטי $(date -u +'%Y-%m-%d %H:%M UTC')"
            # עמידות להתנגשות דחיפה (שתי ריצות במקביל): rebase על הרמוט ונסה שוב
            for i in 1 2 3 4 5; do
              if git push; then
                echo "pushed on attempt $i"; exit 0
              fi
              echo "push rejected — rebasing and retrying ($i)…"
              git pull --rebase --autostash origin main || true
              sleep 3
            done
            echo "push failed after retries"; exit 1
          fi
