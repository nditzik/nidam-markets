name: Probe earnings dates (one-off)

# בדיקה חד-פעמית (2.10.2026): תאריכי דוחות קודמים אמיתיים ל"לקראת הדוח". יימחק אחרי הבדיקה.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-edates.yml"
      - "scripts/tools/probe_edates.py"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/tools/probe_edates.py JPM PEP MSFT
