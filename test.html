<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>TradingView ticker test</title></head>
<body style="font-family:Arial;padding:20px">
<h3>בדיקת TradingView — אמור להופיע סרט מחירים למטה:</h3>

<!-- ההטמעה הרשמית הפשוטה, בדיוק כמו ממחולל הווידג'טים של TradingView -->
<div class="tradingview-widget-container">
  <div class="tradingview-widget-container__widget"></div>
  <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
  {
  "symbols": [
    { "symbol": "CME_MINI:ES1!", "title": "S&P Fut" },
    { "symbol": "CME_MINI:NQ1!", "title": "Nasdaq Fut" },
    { "symbol": "AMEX:SPY", "title": "SPY" },
    { "symbol": "NASDAQ:QQQ", "title": "QQQ" },
    { "symbol": "AMEX:IWM", "title": "IWM" },
    { "symbol": "CBOE:VIX", "title": "VIX" },
    { "symbol": "TVC:US10Y", "title": "US 10Y" },
    { "symbol": "TVC:DXY", "title": "DXY" }
  ],
  "showSymbolLogo": true,
  "isTransparent": false,
  "displayMode": "adaptive",
  "colorTheme": "light",
  "locale": "en"
  }
  </script>
</div>

<p style="color:#888;margin-top:30px;font-size:13px">אם רואים כאן סרט מחירים = TradingView עובד. אם ריק = בעיה בסמלים/חסימה.</p>
</body>
</html>
