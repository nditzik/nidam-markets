<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>TradingView ticker test</title></head>
<body style="font-family:Arial;padding:20px">
<h3>בדיקת TradingView — אמור להופיע סרט מחירים למטה:</h3>

<!-- ההטמעה הרשמית הפשוטה, בדיוק כמו ממחולל הווידג'טים של TradingView -->
<div class="tradingview-widget-container">
  <div class="tradingview-widget-container__widget"></div>
  <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
  {
  "symbols": [
    { "description": "S&P Fut", "proxy": "CME_MINI:ES1!" },
    { "description": "Nasdaq Fut", "proxy": "CME_MINI:NQ1!" },
    { "description": "SPY", "proxy": "AMEX:SPY" },
    { "description": "QQQ", "proxy": "NASDAQ:QQQ" },
    { "description": "IWM", "proxy": "AMEX:IWM" },
    { "description": "VIX", "proxy": "CBOE:VIX" },
    { "description": "US 10Y", "proxy": "TVC:US10Y" },
    { "description": "DXY", "proxy": "TVC:DXY" }
  ],
  "showSymbolLogo": true,
  "isTransparent": false,
  "displayMode": "adaptive",
  "colorTheme": "light",
  "locale": "en"
  }
  </script>
</div>

<p style="color:#888;margin-top:30px;font-size:13px">אם רואים כאן סרט מחירים = TradingView עובד. אם ריק = בעיה בסמלים/חסימה.</p>
</body>
</html>
